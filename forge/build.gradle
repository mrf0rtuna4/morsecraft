plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge(
            "net.minecraftforge:forge:" +
                    "${project.minecraft_version}-${project.forge_version}"
    )

    modImplementation(
            "dev.architectury:architectury-forge:${project.architectury_api_version}"
    )

    common(
            project(
                    path: ":common",
                    configuration: "namedElements"
            )
    ) {
        transitive = false
    }

    shadowBundle(
            project(
                    path: ":common",
                    configuration: "transformProductionForge"
            )
    )
}

shadowJar {
    configurations = [
            project.configurations.shadowBundle
    ]

    archiveClassifier = "dev-shadow"
}

remapJar {
    dependsOn shadowJar
    inputFile.set(shadowJar.archiveFile)
    archiveClassifier = null
}